<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit backoffice operations console</title>

    <!--
      The theme is applied before first paint so a dark-mode user never sees a white
      flash. It has to be inline and synchronous: a deferred script runs after the
      browser has already painted.
    -->
    <script>
      try {
        var stored = localStorage.getItem('orbit-theme')
        // Light by default, matching the public site, the enterprise console and every
        // Orbit email, so an operator moving between them sees one product rather than
        // three. It does not follow the system preference: a laptop set to dark mode
        // should not decide what the company's console looks like.
        //
        // Dark is still a first-class theme here — repainted to the same Orbit Orange at
        // the same time — and it is one click away on the toggle, which is what a night
        // shift on a dim wall display should use. The choice is remembered per browser.
        document.documentElement.dataset.theme = stored || 'light'
      } catch (_) {
        /* Private mode, or storage disabled. The light default already applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
