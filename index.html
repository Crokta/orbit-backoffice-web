<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit backoffice operations console</title>

    <!--
      The theme is applied before first paint so a dark-mode user never sees a white
      flash. It has to be inline and synchronous: a deferred script runs after the
      browser has already painted.
    -->
    <script>
      try {
        var stored = localStorage.getItem('orbit-theme')
        // Dark by default, unlike the enterprise app. Live-ops screens sit on wall
        // displays in rooms that stay dim for hours, and a white canvas at 3 a.m. is
        // the reason people turn the monitor away.
        document.documentElement.dataset.theme = stored || 'dark'
      } catch (_) {
        /* Private mode, or storage disabled. The light default already applies. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
